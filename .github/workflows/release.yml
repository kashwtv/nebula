name: Build Nebula + updater
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build mod
        run: chmod +x gradlew && ./gradlew build
      - name: Build updater
        run: bash updater/build.sh && (cd updater/out && zip -r ../../nebula-updater.zip nebula-updater.jar "Nebula Updater.bat" updater.json README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: nebula
          path: |
            build/libs/nebula-*.jar
            updater/out/nebula-updater.jar
            nebula-updater.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/nebula-*.jar
            updater/out/nebula-updater.jar
            nebula-updater.zip
